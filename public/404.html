<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404: Extinction Event</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 404 Specific Styles - Dark & Dangerous */
        body {
            background-color: #020c1b; /* Pitch black/navy */
            color: #64ffda; /* Your Teal Accent */
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            padding: 20px;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            letter-spacing: 5px;
            color: #ccd6f6;
            text-shadow: 2px 2px #64ffda;
        }

        p {
            font-size: 1.2rem;
            color: #8892b0;
            margin-bottom: 30px;
        }

        .raptor-img {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(100, 255, 218, 0.2); /* Teal Glow */
            margin: 20px 0;
            border: 1px solid #64ffda;
        }

        .escape-btn {
            display: inline-block;
            padding: 15px 30px;
            background: transparent;
            color: #64ffda;
            border: 2px solid #64ffda;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .escape-btn:hover {
            background: rgba(100, 255, 218, 0.1);
            box-shadow: 0 0 15px rgba(100, 255, 218, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>404</h1>
        
        <img src="images/raptor-404.jpg" alt="A menacing raptor" class="raptor-img">
        
        <h2>EXTINCTION EVENT DETECTED</h2>
        <p>The page you are looking for has been devoured.</p>

        <a href="/" class="escape-btn">Initiate Escape Protocol</a>
    </div>

</body>
</html>
